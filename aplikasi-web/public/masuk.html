<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Tool Tukin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='27' font-weight='700' fill='white' text-anchor='middle'%3ETT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/gaya.css">
</head>
<body class="halaman-polos">
<form class="kartu-masuk" id="form" novalidate>
  <div class="merek-masuk">
    <span class="logo">TT</span>
    <div>
      <b>Tool Tukin</b>
      <span>Rekap Tunjangan Kinerja &amp; Uang Makan</span>
    </div>
  </div>

  <h1>Masuk ke akun</h1>
  <p class="sub">Pegawai: masuk dengan <b>NIP</b> &amp; password. Admin: gunakan <b>username</b> atau email.</p>

  <label for="email">NIP / Username / Email</label>
  <input id="email" type="text" autocomplete="username" required placeholder="NIP, username admin, atau email">

  <label for="password">Password</label>
  <div class="kolom-sandi">
    <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    <button class="lihat-sandi" data-target="password" type="button"></button>
  </div>

  <button class="utama" id="tombol" type="submit" style="width:100%;margin-top:20px">Masuk</button>

  <div class="pesan" id="pesan" role="alert"></div>

  <p class="kaki">Belum punya akun? Daftar di halaman <a href="/daftar.html">Daftar</a>.
    Jangan bagikan password ke siapa pun.</p>
</form>

<script src="/lib/sandi.js"></script>
<script>
(function () {
  var form = document.getElementById('form');
  var tombol = document.getElementById('tombol');
  var pesan = document.getElementById('pesan');
  var konfigurasi = null;

  function tampilkan(teks, jenis) {
    pesan.textContent = teks;
    pesan.className = 'pesan tampil ' + (jenis || 'galat');
  }

  // Ambil URL + kunci publishable dari server (bukan rahasia).
  fetch('/api/konfigurasi').then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (h) {
    if (!h.ok) throw new Error(h.j.pesan || 'Konfigurasi tidak terbaca');
    konfigurasi = h.j;
  }).catch(function (e) {
    tampilkan('Server belum siap: ' + e.message);
    tombol.disabled = true;
  });

  var pesanGalat = {
    'Invalid login credentials': 'NIP/username atau password salah.',
    'Email not confirmed': 'Email belum dikonfirmasi admin.',
    'Too many requests': 'Terlalu banyak percobaan. Tunggu beberapa menit.'
  };

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!konfigurasi) { tampilkan('Konfigurasi belum siap, muat ulang halaman.'); return; }

    var masuk = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!masuk || !password) { tampilkan('NIP/email dan password wajib diisi.'); return; }
    // Supabase Auth memakai email: pegawai = <NIP>@pegawai..., admin = <username>@admin...
    var bersih = masuk.replace(/\s/g, '');
    var email;
    if (/^\d{18}$/.test(bersih)) email = bersih + '@pegawai.tooltukin.id';
    else if (bersih.indexOf('@') > -1) email = bersih;
    else email = bersih.toLowerCase() + '@admin.tooltukin.id';

    tombol.disabled = true;
    tombol.textContent = 'Memeriksa…';

    fetch(konfigurasi.url + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: konfigurasi.kunci, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (h) {
      if (!h.ok) {
        var kunci = (h.j.error_description || h.j.msg || h.j.error || '').trim();
        tampilkan(pesanGalat[kunci] || ('Gagal masuk: ' + (kunci || 'kesalahan tidak dikenal')));
        return;
      }
      var meta = (h.j.user && h.j.user.user_metadata) || {};
      sessionStorage.setItem('sesi', JSON.stringify({
        access_token: h.j.access_token,
        refresh_token: h.j.refresh_token,
        email: (h.j.user && h.j.user.email) || email,
        id: (h.j.user && h.j.user.id) || '',
        metadata: meta,
        harusGanti: !!meta.harus_ganti_password
      }));
      tampilkan('Berhasil. Mengalihkan…', 'info');
      // admin -> panel admin, pegawai -> dasbor pegawai
      fetch(konfigurasi.url + '/rest/v1/users?select=peran&id=eq.' + encodeURIComponent(h.j.user.id), {
        headers: { apikey: konfigurasi.kunci, Authorization: 'Bearer ' + h.j.access_token }
      }).then(function (x) { return x.json(); }).then(function (u) {
        var peran = (u && u[0] && u[0].peran) || 'pegawai';
        location.href = peran === 'admin' ? '/admin.html' : '/dasbor.html';
      }).catch(function () { location.href = '/dasbor.html'; });
    }).catch(function () {
      tampilkan('Tidak bisa menghubungi server Supabase. Periksa koneksi internet.');
    }).then(function () {
      tombol.disabled = false;
      tombol.textContent = 'Masuk';
    });
  });
})();
</script>
</body>
</html>
