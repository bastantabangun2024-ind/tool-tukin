<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganti Password — Tool Tukin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='27' font-weight='700' fill='white' text-anchor='middle'%3ETT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/gaya.css">
</head>
<body class="halaman-polos">
<form class="kartu-masuk" id="form" novalidate>
  <div class="merek-masuk">
    <span class="logo">TT</span>
    <div>
      <b>Tool Tukin</b>
      <span>Rekap Tunjangan Kinerja &amp; Uang Makan</span>
    </div>
  </div>

  <h1>Ganti password</h1>
  <p class="sub">Anda masuk sebagai <b id="akun">…</b>. Password lama tidak perlu dimasukkan,
    dan Anda tetap masuk setelah password diganti.</p>

  <label for="sandiBaru">Password baru</label>
  <div class="kolom-sandi">
    <input id="sandiBaru" type="password" autocomplete="new-password" required minlength="8" placeholder="Minimal 8 karakter">
    <button class="lihat-sandi" data-target="sandiBaru" type="button"></button>
  </div>

  <label for="sandiUlang">Ulangi password baru</label>
  <div class="kolom-sandi">
    <input id="sandiUlang" type="password" autocomplete="new-password" required minlength="8" placeholder="Ketik ulang password baru">
    <button class="lihat-sandi" data-target="sandiUlang" type="button"></button>
  </div>

  <button class="utama" id="tombol" type="submit" style="width:100%;margin-top:20px">Simpan password baru</button>

  <div class="pesan" id="pesan" role="alert"></div>

  <p class="kaki"><a href="/dasbor.html" id="tautanKembali">Kembali ke dasbor</a>.
    Jangan bagikan password ke siapa pun.</p>
</form>

<script src="/lib/sandi.js"></script>
<script>
(function () {
  var sesi = null;
  try { sesi = JSON.parse(sessionStorage.getItem('sesi') || 'null'); } catch (e) { sesi = null; }
  if (!sesi || !sesi.access_token) { location.replace('/masuk.html'); return; }

  var form = document.getElementById('form');
  var tombol = document.getElementById('tombol');
  var pesan = document.getElementById('pesan');
  var konfigurasi = null;
  var selesai = false;

  document.getElementById('akun').textContent = /@pegawai\.tooltukin\.id$/i.test(sesi.email || '')
    ? String(sesi.email).split('@')[0] : (sesi.email || 'akun ini');

  function tampilkan(teks, jenis) {
    pesan.textContent = teks;
    pesan.className = 'pesan tampil ' + (jenis || 'galat');
  }

  fetch('/api/konfigurasi').then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (h) {
    if (!h.ok) throw new Error(h.j.pesan || 'Konfigurasi tidak terbaca');
    konfigurasi = h.j;
  }).catch(function (e) {
    tampilkan('Server belum siap: ' + e.message);
    tombol.disabled = true;
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (selesai) return;
    var baru = document.getElementById('sandiBaru').value;
    var ulang = document.getElementById('sandiUlang').value;
    if (baru.length < 8) { tampilkan('Password baru minimal 8 karakter.'); return; }
    if (baru !== ulang) { tampilkan('Ulangi password belum sama.'); return; }
    if (!konfigurasi) { tampilkan('Konfigurasi server belum siap. Muat ulang halaman.'); return; }

    tombol.disabled = true;
    tampilkan('Menyimpan password baru…', 'info');
    var meta = Object.assign({}, sesi.metadata || {}, { harus_ganti_password: false });

    fetch(konfigurasi.url + '/auth/v1/user', {
      method: 'PUT',
      headers: {
        apikey: konfigurasi.kunci,
        Authorization: 'Bearer ' + sesi.access_token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ password: baru, data: meta })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    }).then(function (h) {
      if (!h.ok) {
        if (h.status === 401 || h.status === 403) {
          tampilkan('Sesi Anda sudah berakhir. Silakan masuk lagi, lalu buka halaman ini.');
          tombol.textContent = 'Masuk';
          tombol.disabled = false;
          tombol.type = 'button';
          tombol.onclick = function () { location.href = '/masuk.html'; };
          return;
        }
        tampilkan('Gagal: ' + (h.j.msg || h.j.error_description || h.j.error || ('HTTP ' + h.status)));
        tombol.disabled = false;
        return;
      }

      selesai = true;
      sesi.metadata = meta;
      sesi.harusGanti = false;
      sessionStorage.setItem('sesi', JSON.stringify(sesi));
      document.getElementById('sandiBaru').value = '';
      document.getElementById('sandiUlang').value = '';
      tampilkan('✔ Password berhasil diganti. Anda tetap masuk; mengalihkan ke dasbor…', 'info');
      tombol.textContent = 'Tersimpan';
      setTimeout(function () { location.href = '/dasbor.html'; }, 1800);
    }).catch(function () {
      tampilkan('Tidak bisa menghubungi server. Periksa koneksi internet.');
      tombol.disabled = false;
    });
  });
})();
</script>
</body>
</html>
